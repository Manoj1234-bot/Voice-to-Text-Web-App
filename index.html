<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice to Text</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="header">
    <h1>🎙️ Voice to Text</h1>
    <p class="subtitle">Speak, and watch your words appear — powered by the Web Speech API</p>
  </div>

  <div class="main-card">
    <div class="controls-row">
      <select id="languageSelect">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-IN">English (India)</option>
        <option value="hi-IN">Hindi</option>
        <option value="kn-IN">Kannada</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
      </select>

      <button id="micBtn" class="mic-btn">
        <span id="micIcon">🎤</span>
        <span id="micLabel">Start Listening</span>
      </button>
    </div>

    <div class="status-row" id="statusRow">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Not listening</span>
    </div>

    <div class="transcript-box" id="transcriptBox">
      <textarea id="transcriptText" placeholder="Your speech will appear here..."></textarea>
    </div>

    <div class="stats-row">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 characters</span>
    </div>

    <div class="action-row">
      <button id="copyBtn" class="action-btn">📋 Copy</button>
      <button id="downloadBtn" class="action-btn">⬇️ Download .txt</button>
      <button id="clearBtn" class="action-btn danger">🗑️ Clear</button>
    </div>

    <div class="error" id="errorMsg"></div>
  </div>

  <p class="credit">Developed by <strong>Manoj S</strong></p>
</div>

<script src="script.js"></script>
</body>
</html>
